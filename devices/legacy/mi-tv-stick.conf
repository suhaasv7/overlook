# Mi TV Stick: what Overlook shows on it. Applied with:  sh install.sh <TV_IP> devices/legacy/mi-tv-stick.conf
# Every line is optional. Options left out keep their defaults (photos=time, weather=on, dim=on,
# date=off, clock follows the TV, order=mine); anything changed later in the ••• menu stays on the TV
# until this file is installed again.
#   apps=     the row, in order. A folder is folder:<name>.
#   folders=  <name>=<package>+<package>;<name>=…
#   options=  name, photos, weather, dim, date, clock (12/24), order (mine/used), location (lat,lon)
apps=com.google.android.youtube.tv,com.crunchyroll.crunchyroid,com.apple.atve.androidtv.appletv,in.startv.hotstar,com.sonyliv,com.android.vending,com.netflix.ninja,com.amazon.amazonvideo.livingroom
options=name=Suhaas
