# Generic Android TV / Google TV home settings.
# sh install.sh <TV_IP> devices/android-google-tv/home.conf
# Only installed apps appear. Adjust this list to your services.
# options: version=v1 (classic) or version=v2 (Continue watching).
# V2 uses Scenic dock only. Example: options=version=v2
# Older saved layout names are ignored.
apps=com.google.android.youtube.tv,com.netflix.ninja,com.amazon.amazonvideo.livingroom
options=version=v1
